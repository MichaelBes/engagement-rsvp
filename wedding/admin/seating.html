<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seating Chart — Wedding Admin</title>
<meta name="robots" content="noindex">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap');
  :root{ --indigo:#1B2340; --gold:#C9A24B; --ivory:#F8F4EA; --wine:#6B1F2B; --charcoal:#2A2A28; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--indigo); color:var(--ivory); font-family:'Inter',sans-serif; height:100%; }
  .top-bar{ display:flex; align-items:center; gap:8px; padding:12px 18px; background:var(--indigo); flex-wrap:wrap; }
  .top-bar h1{ font-family:'Cormorant Garamond',serif; font-size:21px; margin:0; color:var(--ivory); margin-right:10px; }
  .top-bar .spacer{ flex:1; }
  .btn{ padding:8px 12px; border-radius:8px; border:none; background:var(--wine); color:var(--ivory); font-weight:600; font-size:12.5px; cursor:pointer; }
  .btn.secondary{ background:#33406b; }
  .layout{ display:flex; height: calc(100vh - 54px); }
  .sidebar{ width:250px; background:var(--ivory); color:var(--charcoal); padding:14px; overflow-y:auto; flex-shrink:0; }
  .sidebar h3{ font-size:11.5px; text-transform:uppercase; letter-spacing:0.1em; color:var(--wine); margin:0 0 10px; }
  .sidebar input[type=text]{ width:100%; padding:8px 10px; border-radius:7px; border:1.5px solid #ddd6c4; font-size:13px; margin-bottom:10px; }
  .guest-chip{
    display:flex; align-items:center; justify-content:space-between; gap:6px;
    background:#fff; border:1.5px solid #ddd6c4; border-radius:8px; padding:7px 10px; margin-bottom:6px;
    font-size:12.5px; cursor:grab; user-select:none;
  }
  .guest-chip .dot{ width:9px; height:9px; border-radius:50%; background:var(--gold); flex-shrink:0; }
  .guest-chip.assigned{ opacity:0.4; cursor:default; }
  .guest-chip .where{ font-size:10px; color:#8b8778; }

  .floor{ flex:1; position:relative; background: repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 40px), repeating-linear-gradient(90deg, rgba(255,255,255,0.03) 0 1px, transparent 1px 40px); overflow:auto; }

  .table-wrap{ position:absolute; cursor:move; }

  .table-toolbar{
    position:absolute; top:-50px; left:50%; transform:translateX(-50%);
    display:none; gap:2px; background:#fff; border-radius:6px; padding:3px; box-shadow:0 4px 10px rgba(0,0,0,0.3);
    z-index:30; white-space:nowrap;
  }
  .table-wrap:hover .table-toolbar{ display:flex; }
  .table-toolbar button{ border:none; background:none; cursor:pointer; font-size:11px; padding:3px 6px; color:var(--indigo); border-radius:4px; }
  .table-toolbar button:hover{ background:#F2EDE0; color:var(--wine); }

  .rotate-box{ position:relative; }

  .table-shape{
    width:100%; height:100%;
    background:var(--ivory); color:var(--charcoal); border:2px solid var(--gold); box-shadow:0 10px 25px rgba(0,0,0,0.35);
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
  }
  .table-shape.round, .table-shape.sweetheart{ border-radius:50%; }
  .table-shape.rect, .table-shape.headtable{ border-radius:10px; }
  .table-shape.dancefloor{ border:2px dashed var(--gold-soft, #E4CD97); border-radius:8px; background:rgba(255,255,255,0.04); color:var(--ivory); box-shadow:none; }

  .t-name{ font-family:'Cormorant Garamond',serif; font-weight:600; font-size:14px; border:none; background:transparent; text-align:center; width:88%; color:var(--indigo); }
  .dancefloor .t-name{ color:var(--ivory); }
  .t-cap{ font-size:10px; color:#8b8778; display:flex; align-items:center; gap:4px; margin-top:2px; }
  .seat-btn{ border:none; background:#eee6d4; color:var(--indigo); width:16px; height:16px; border-radius:50%; font-size:11px; line-height:16px; text-align:center; cursor:pointer; padding:0; }
  .seat-btn:hover{ background:var(--gold); color:#fff; }

  .seat{
    position:absolute; width:26px; height:26px; margin-left:-13px; margin-top:-13px;
    border-radius:50%; background:#fff; border:1.5px dashed #c8c0ab; z-index:5;
    display:flex; align-items:center; justify-content:center; font-size:9.5px; color:#aaa; cursor:pointer;
  }
  .seat.filled{ border-style:solid; border-color:var(--wine); background:var(--wine); color:#fff; font-weight:700; }
  .seat.drop-hover{ outline:2px solid var(--gold); outline-offset:1px; }

  .resize-handle{
    position:absolute; right:-7px; bottom:-7px; width:14px; height:14px; z-index:25;
    background:var(--gold); border:1.5px solid #fff; border-radius:3px; cursor:nwse-resize;
  }

  .rotate-handle{
    position:absolute; top:-82px; left:50%; transform:translateX(-50%); z-index:25;
    width:22px; height:22px; border-radius:50%; background:var(--gold); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:12px; cursor:grab;
    border:1.5px solid #fff; box-shadow:0 2px 6px rgba(0,0,0,0.35);
  }
  .rotate-handle::after{
    content:""; position:absolute; top:22px; left:50%; width:1px; height:30px;
    background:rgba(228,205,151,0.6); transform:translateX(-50%); z-index:-1;
  }

  @media print{
    .top-bar, .sidebar, .table-toolbar, .resize-handle, .rotate-handle{ display:none; }
    body{ background:#fff; }
    .floor{ height:auto; overflow:visible; }
    .table-wrap{ box-shadow:none; }
  }
</style>
</head>
<body>
<div class="top-bar">
  <a href="index.html" style="color:#cfc9b8;font-size:12.5px;text-decoration:none;margin-right:6px;">&larr; Admin</a>
  <h1>Seating Chart</h1>
  <button class="btn secondary" id="add-round">+ Round</button>
  <button class="btn secondary" id="add-rect">+ Rectangle</button>
  <button class="btn secondary" id="add-sweetheart">+ Sweetheart</button>
  <button class="btn secondary" id="add-headtable">+ Head Table</button>
  <button class="btn secondary" id="add-dancefloor">+ Dance Floor</button>
  <div class="spacer"></div>
  <button class="btn secondary" id="print-btn">Print</button>
  <button class="btn" id="save-btn">Save</button>
</div>
<div class="layout">
  <div class="sidebar">
    <h3>Confirmed Guests (Reception)</h3>
    <input type="text" id="guest-search" placeholder="Search guests..." />
    <div id="guest-list"></div>
  </div>
  <div class="floor" id="floor"></div>
</div>

<script>
(function(){
  const ADMIN_PASSCODE = "MaroGeorgeWedding2027";
  const API_URL = "https://script.google.com/macros/s/AKfycbwzEPctYkISweBpnYKHBXpvk7RMCM7xiQxYgI-xnmEOZ7p2wjqDUm_Xfa7d4DcCro-T/exec";

  // Single sign-on: shares one login with /wedding/admin/ and the
  // engagement admin page — if you unlocked any of them already in this
  // browser tab, you won't be asked again here.
  if (sessionStorage.getItem('site_admin_ok') !== '1'){
    const entered = prompt('Admin passcode:');
    if (entered !== ADMIN_PASSCODE){
      document.body.innerHTML = '<p style="color:#fff;text-align:center;margin-top:100px;">Incorrect passcode.</p>';
      return;
    }
    sessionStorage.setItem('site_admin_ok', '1');
  }

  async function apiGet(action, p){
    const url = new URL(API_URL);
    url.searchParams.set('action', action);
    Object.entries(p || {}).forEach(([k,v]) => url.searchParams.set(k, v));
    const res = await fetch(url.toString());
    return res.json();
  }
  async function apiPost(action, payload){
    const res = await fetch(API_URL, {
      method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(Object.assign({ action }, payload))
    });
    return res.json();
  }

  function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function initials(name){ return name.split(' ').map(p=>p[0]).join('').slice(0,2).toUpperCase(); }

  // table: { id, type, name, x, y, width, height, rotation, seats: [guestId|null, ...] }
  let guests = [];        // [{id, name, familyName}]
  let tables = [];
  let nextNum = { round:1, rect:1, sweetheart:1, headtable:1, dancefloor:1 };
  let searchQuery = '';

  // One shared drag state for move/resize/rotate, instead of each table
  // adding its own document-level listeners on every render (which would
  // otherwise pile up more and more stale listeners every time the floor
  // re-renders — e.g. every time a seat is added or removed).
  let activeOp = null;
  const ROTATE_SNAP_DEGREES = 8; // snap to the nearest 45° within this many degrees; otherwise free rotation

  document.addEventListener('mousemove', (e) => {
    if (!activeOp) return;
    if (activeOp.type === 'move'){
      const x = Math.max(0, e.clientX - activeOp.offX);
      const y = Math.max(0, e.clientY - activeOp.offY);
      activeOp.wrap.style.left = x + 'px';
      activeOp.wrap.style.top = y + 'px';
      activeOp.table.x = x; activeOp.table.y = y;
    } else if (activeOp.type === 'resize'){
      const dx = e.clientX - activeOp.startX, dy = e.clientY - activeOp.startY;
      // The resize handle now rotates along with the table, so a screen-space
      // mouse drag has to be translated into the table's own (unrotated) width/
      // height axes before it's applied — otherwise dragging "outward" on a
      // rotated table would grow it in the wrong direction.
      const rad = (activeOp.rotation || 0) * Math.PI / 180;
      const localDx = dx * Math.cos(rad) + dy * Math.sin(rad);
      const localDy = -dx * Math.sin(rad) + dy * Math.cos(rad);
      let newW = Math.max(activeOp.minW, activeOp.startW + localDx);
      let newH = Math.max(activeOp.minH, activeOp.startH + localDy);
      if (activeOp.square){ const s = Math.max(newW, newH); newW = s; newH = s; }
      activeOp.table.width = newW; activeOp.table.height = newH;
      renderTables();
    } else if (activeOp.type === 'rotate'){
      const dx = e.clientX - activeOp.centerX, dy = e.clientY - activeOp.centerY;
      let raw = Math.atan2(dx, -dy) * 180 / Math.PI; // 0° = straight up, clockwise positive
      raw = ((raw % 360) + 360) % 360;
      const nearest45 = Math.round(raw / 45) * 45 % 360;
      let diff = Math.abs(raw - nearest45); if (diff > 180) diff = 360 - diff;
      const finalDeg = diff <= ROTATE_SNAP_DEGREES ? nearest45 : raw;
      activeOp.table.rotation = finalDeg;
      activeOp.rotateBox.style.transform = `rotate(${finalDeg}deg)`;
    }
  });
  document.addEventListener('mouseup', () => {
    if (activeOp && activeOp.type === 'rotate') renderTables(); // resync seat hit-areas after a free rotation
    activeOp = null;
  });

  const TYPE_DEFAULTS = {
    round:      { label: 'Table',      seatCount: 8,  shapeClass:'round',      w:120, h:120, minW:70,  minH:70,  square:true  },
    rect:       { label: 'Table',      seatCount: 8,  shapeClass:'rect',       w:160, h:70,  minW:100, minH:50,  square:false },
    sweetheart: { label: 'Sweetheart', seatCount: 2,  shapeClass:'sweetheart', w:70,  h:70,  minW:50,  minH:50,  square:true  },
    headtable:  { label: 'Head Table', seatCount: 10, shapeClass:'headtable', w:280, h:56,  minW:160, minH:48,  square:false },
    dancefloor: { label: 'Dance Floor',seatCount: 0,  shapeClass:'dancefloor', w:220, h:160, minW:100, minH:100, square:false },
  };

  function findAssignment(guestId){
    for (const t of tables){
      const idx = (t.seats||[]).indexOf(guestId);
      if (idx !== -1) return t.name;
    }
    return null;
  }

  function renderGuestList(){
    const list = document.getElementById('guest-list');
    const q = searchQuery.toLowerCase();
    const filtered = guests.filter(g => g.name.toLowerCase().includes(q));
    list.innerHTML = filtered.map(g => {
      const where = findAssignment(g.id);
      return `
      <div class="guest-chip ${where ? 'assigned' : ''}" draggable="${where ? 'false' : 'true'}" data-guest-id="${esc(g.id)}">
        <span><span class="dot"></span> ${esc(g.name)}</span>
        ${where ? `<span class="where">${esc(where)}</span>` : ''}
      </div>`;
    }).join('');
    list.querySelectorAll('.guest-chip[draggable="true"]').forEach(chip => {
      chip.addEventListener('dragstart', (e) => {
        e.dataTransfer.setData('text/plain', chip.dataset.guestId);
      });
    });
  }

  function seatPositions(type, seatCount, shapeW, shapeH){
    const pts = [];
    if (type === 'round' || type === 'sweetheart'){
      const r = (shapeW / 2) + 16;
      for (let i = 0; i < seatCount; i++){
        const angle = (2 * Math.PI * i / seatCount) - Math.PI/2;
        pts.push({ x: shapeW/2 + r * Math.cos(angle), y: shapeH/2 + r * Math.sin(angle) });
      }
    } else {
      // rect / headtable: split along top and bottom edges, spaced across whatever the current width is
      const perSide = Math.ceil(seatCount / 2);
      for (let i = 0; i < seatCount; i++){
        const side = i < perSide ? -1 : 1; // top vs bottom
        const idxInSide = i < perSide ? i : i - perSide;
        const sideCount = i < perSide ? perSide : seatCount - perSide;
        const x = (shapeW / (sideCount + 1)) * (idxInSide + 1);
        const y = side === -1 ? -16 : shapeH + 16;
        pts.push({ x, y });
      }
    }
    return pts;
  }

  function dims(t){
    const def = TYPE_DEFAULTS[t.type];
    return { w: t.width || def.w, h: t.height || def.h };
  }

  function renderTables(){
    const floor = document.getElementById('floor');
    floor.innerHTML = '';
    tables.forEach(t => {
      const def = TYPE_DEFAULTS[t.type];
      const { w, h } = dims(t);
      const rotation = t.rotation || 0;

      const wrap = document.createElement('div');
      wrap.className = 'table-wrap';
      wrap.style.left = t.x + 'px';
      wrap.style.top = t.y + 'px';
      wrap.style.width = w + 'px';
      wrap.style.height = h + 'px';

      const seatedCount = (t.seats||[]).filter(Boolean).length;
      wrap.innerHTML = `
        <div class="table-toolbar">
          <button data-act="dup" title="Duplicate">Dup</button>
          <button data-act="del" title="Delete">Del</button>
        </div>
        <div class="rotate-box" style="width:${w}px;height:${h}px;transform:rotate(${rotation}deg);">
          <div class="table-shape ${def.shapeClass}">
            <input class="t-name" value="${esc(t.name)}" />
            ${t.type !== 'dancefloor' ? `
              <div class="t-cap">
                <button class="seat-btn" data-act="seat-minus" title="Remove a seat">&minus;</button>
                <span>${seatedCount}/${t.seats.length} seats</span>
                <button class="seat-btn" data-act="seat-plus" title="Add a seat">+</button>
              </div>` : ''}
          </div>
          <div class="rotate-handle" title="Drag to rotate — snaps to 45° steps unless you drag away from one">&#8635;</div>
          <div class="resize-handle" title="Drag to resize"></div>
        </div>
      `;

      const rotateBox = wrap.querySelector('.rotate-box');

      if (t.type !== 'dancefloor'){
        const positions = seatPositions(t.type, t.seats.length, w, h);
        positions.forEach((pos, i) => {
          const guestId = t.seats[i];
          const g = guestId ? guests.find(x => x.id === guestId) : null;
          const seat = document.createElement('div');
          seat.className = 'seat' + (g ? ' filled' : '');
          seat.style.left = pos.x + 'px';
          seat.style.top = pos.y + 'px';
          seat.textContent = g ? initials(g.name) : (i+1);
          seat.title = g ? g.name : 'Empty seat';
          seat.dataset.seatIndex = i;

          seat.addEventListener('dragover', (e) => { e.preventDefault(); seat.classList.add('drop-hover'); });
          seat.addEventListener('dragleave', () => seat.classList.remove('drop-hover'));
          seat.addEventListener('drop', (e) => {
            e.preventDefault();
            seat.classList.remove('drop-hover');
            const gid = e.dataTransfer.getData('text/plain');
            if (!gid) return;
            if (t.seats[i]) { alert('That seat is already taken.'); return; }
            t.seats[i] = gid;
            renderGuestList(); renderTables();
          });
          seat.addEventListener('click', () => {
            if (!t.seats[i]) return;
            if (confirm('Remove ' + g.name + ' from this seat?')){
              t.seats[i] = null;
              renderGuestList(); renderTables();
            }
          });
          rotateBox.appendChild(seat);
        });
      }

      // dragging the whole table to reposition
      wrap.addEventListener('mousedown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.closest('.table-toolbar') ||
            e.target.classList.contains('seat') || e.target.classList.contains('resize-handle') ||
            e.target.classList.contains('rotate-handle') || e.target.classList.contains('seat-btn')) return;
        activeOp = { type:'move', table:t, wrap, offX: e.clientX - wrap.offsetLeft, offY: e.clientY - wrap.offsetTop };
      });

      // resizing
      const handle = wrap.querySelector('.resize-handle');
      handle.addEventListener('mousedown', (e) => {
        e.stopPropagation();
        activeOp = { type:'resize', table:t, startX:e.clientX, startY:e.clientY, startW:w, startH:h, minW:def.minW, minH:def.minH, square:!!def.square, rotation };
      });

      // rotating — free angle, snapping near 45° steps (see ROTATE_SNAP_DEGREES)
      const rotateHandle = wrap.querySelector('.rotate-handle');
      rotateHandle.addEventListener('mousedown', (e) => {
        e.stopPropagation();
        const rect = wrap.getBoundingClientRect();
        activeOp = { type:'rotate', table:t, rotateBox, centerX: rect.left + rect.width/2, centerY: rect.top + rect.height/2 };
      });

      wrap.querySelector('.t-name').addEventListener('input', (e) => { t.name = e.target.value; });
      wrap.querySelector('[data-act="del"]').addEventListener('click', () => {
        tables = tables.filter(x => x.id !== t.id);
        renderGuestList(); renderTables();
      });
      wrap.querySelector('[data-act="dup"]').addEventListener('click', () => {
        const copy = JSON.parse(JSON.stringify(t));
        copy.id = 't' + Date.now() + Math.floor(Math.random()*1000);
        copy.x = t.x + 30; copy.y = t.y + 30;
        copy.seats = copy.seats.map(() => null);
        tables.push(copy);
        renderTables();
      });
      const minusBtn = wrap.querySelector('[data-act="seat-minus"]');
      const plusBtn = wrap.querySelector('[data-act="seat-plus"]');
      if (minusBtn) minusBtn.addEventListener('click', () => {
        if (t.seats.length <= 1) return;
        const removed = t.seats[t.seats.length - 1];
        if (removed && !confirm('The last seat is occupied — remove it and the guest anyway?')) return;
        t.seats.pop();
        renderGuestList(); renderTables();
      });
      if (plusBtn) plusBtn.addEventListener('click', () => {
        t.seats.push(null);
        renderTables();
      });

      floor.appendChild(wrap);
    });
  }

  function addTable(type){
    const def = TYPE_DEFAULTS[type];
    const id = 't' + Date.now() + Math.floor(Math.random()*1000);
    tables.push({
      id, type,
      name: def.label + (def.seatCount ? ' ' + (nextNum[type]++) : ''),
      x: 40 + (tables.length % 4) * 220,
      y: 40 + Math.floor(tables.length / 4) * 240,
      width: def.w, height: def.h, rotation: 0,
      seats: new Array(def.seatCount).fill(null),
    });
    renderTables();
  }

  document.getElementById('add-round').onclick = () => addTable('round');
  document.getElementById('add-rect').onclick = () => addTable('rect');
  document.getElementById('add-sweetheart').onclick = () => addTable('sweetheart');
  document.getElementById('add-headtable').onclick = () => addTable('headtable');
  document.getElementById('add-dancefloor').onclick = () => addTable('dancefloor');
  document.getElementById('print-btn').onclick = () => window.print();
  document.getElementById('guest-search').addEventListener('input', (e) => { searchQuery = e.target.value; renderGuestList(); });
  document.getElementById('save-btn').onclick = async () => {
    const btn = document.getElementById('save-btn');
    btn.disabled = true; btn.textContent = 'Saving...';
    await apiPost('saveSeatingData', { tables });
    btn.disabled = false; btn.textContent = 'Save';
  };

  async function boot(){
    const [families, seating] = await Promise.all([
      apiGet('getAllFamilies'),
      apiGet('getSeatingData'),
    ]);
    guests = [];
    (families.families||[]).forEach(f => {
      (f.members||[]).forEach(m => {
        if (m.reception === true) guests.push({ id: m.id, name: m.name, familyName: f.familyName });
      });
    });
    if (seating && seating.tables && seating.tables.length){
      tables = seating.tables;
      Object.keys(nextNum).forEach(type => {
        const count = tables.filter(t => t.type === type).length;
        nextNum[type] = count + 1;
      });
    }
    renderGuestList();
    renderTables();
  }
  boot();
})();
</script>
</body>
</html>
