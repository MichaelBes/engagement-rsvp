<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maro & George — Wedding</title>

<link rel="icon" type="image/png" href="../engagement/favicon.png">
<link rel="apple-touch-icon" href="../engagement/favicon.png">
<link rel="stylesheet" href="style.css">
<meta name="theme-color" id="theme-color-meta" content="#ddc99d">

<meta property="og:title" content="Maro & George's Wedding">
<meta property="og:description" content="You're invited! June 19, 2027. Tap to RSVP.">
<meta property="og:url" content="https://maroandgeorge.com/wedding/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
</head>
<body>
<div id="app" class="stage"></div>

<script>
(function(){
  // ---- CONFIG ----------------------------------------------------------
  const EVENT = {
    coupleA: "Maro",
    coupleB: "George",
    dateLabel: "Saturday, June 19th, 2027",
  };

  const API_URL = "https://script.google.com/macros/s/AKfycbwzEPctYkISweBpnYKHBXpvk7RMCM7xiQxYgI-xnmEOZ7p2wjqDUm_Xfa7d4DcCro-T/exec"; // same Apps Script URL as the engagement site

  // Set to false once you're ready for the public to see this page.
  const UNDER_CONSTRUCTION = true;
  const PREVIEW_PASSCODE = "MaroGeorgeWedding";

  // Fill these in once the couple decides. Leave empty to hide the section.
  const REGISTRY_LINKS = [
    // { label: "Target Registry", url: "https://www.target.com/gift-registry/..." },
    // { label: "Honeymoon Fund", url: "https://..." },
  ];

  const app = document.getElementById('app');
  const params = new URLSearchParams(window.location.search);

  // ---- API HELPERS -------------------------------------------------------
  async function apiGet(action, p){
    const url = new URL(API_URL);
    url.searchParams.set('action', action);
    Object.entries(p || {}).forEach(([k,v]) => url.searchParams.set(k, v));
    const res = await fetch(url.toString());
    return res.json();
  }
  async function apiPost(action, payload){
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ action }, payload))
    });
    return res.json();
  }

  function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  // ---- SHELL (built once; dynamic content only replaces #app-card) --------
  function buildShell(){
    app.innerHTML = `
      <div id="intro-overlay" class="intro-overlay" aria-hidden="true">
        <div class="intro-pocket"></div>
        <div class="intro-letter">
          <div class="intro-letter-mono">${EVENT.coupleA[0]}<span class="amp">&amp;</span>${EVENT.coupleB[0]}</div>
          <div class="intro-letter-line">You're Invited</div>
          <div class="intro-letter-date">${EVENT.dateLabel}</div>
        </div>
        <div class="intro-flap-wrap">
          <div class="intro-flap"></div>
        </div>
        <div class="intro-seal-wrap">
          <svg viewBox="0 0 120 120" class="intro-seal-svg">
            <defs>
              <radialGradient id="waxBase" cx="38%" cy="30%" r="82%">
                <stop offset="0%" stop-color="#c14b5e"/>
                <stop offset="42%" stop-color="#932e40"/>
                <stop offset="78%" stop-color="#631d2a"/>
                <stop offset="100%" stop-color="#451221"/>
              </radialGradient>
              <radialGradient id="waxGloss" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
                <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
              </radialGradient>
              <filter id="waxShadow" x="-60%" y="-60%" width="220%" height="220%">
                <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1a0608" flood-opacity="0.5"/>
              </filter>
              <filter id="waxSoft" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur stdDeviation="0.7"/>
              </filter>
            </defs>
            <g filter="url(#waxShadow)">
              <path fill="url(#waxBase)" d="M60,4 C69,2 75,9 83,11 C93,13 99,19 104,27 C110,36 112,43 111,53 C110,62 113,69 108,79 C104,88 99,93 91,98 C83,103 77,103 69,109 C61,114 55,114 47,110 C38,106 31,104 24,97 C16,89 11,82 10,72 C9,62 5,55 8,45 C11,34 15,28 22,21 C29,13 35,12 44,9 C50,7 54,6 60,4 Z"/>
              <circle cx="107" cy="85" r="4.5" fill="url(#waxBase)"/>
              <circle cx="17" cy="95" r="4" fill="url(#waxBase)"/>
              <circle cx="89" cy="5" r="3.5" fill="url(#waxBase)"/>
            </g>
            <circle cx="60" cy="60" r="44" fill="none" stroke="#3a0d14" stroke-width="1.3" opacity="0.45"/>
            <circle cx="60" cy="59.4" r="44" fill="none" stroke="#f3cdd2" stroke-width="0.7" opacity="0.3"/>
            <ellipse cx="60" cy="100" rx="42" ry="14" fill="#2c0a10" opacity="0.16" filter="url(#waxSoft)"/>
            <ellipse cx="43" cy="36" rx="27" ry="18" fill="url(#waxGloss)" transform="rotate(-18 43 36)"/>
            <ellipse cx="38" cy="30" rx="10" ry="6" fill="#ffffff" opacity="0.5" filter="url(#waxSoft)" transform="rotate(-18 38 30)"/>
            <g font-family="'Cormorant Garamond', serif" font-style="italic" font-weight="600" font-size="33" text-anchor="middle">
              <text x="61" y="70" fill="#2c0a10" opacity="0.55" filter="url(#waxSoft)">${EVENT.coupleA[0]}<tspan font-size="18" dx="1">&amp;</tspan>${EVENT.coupleB[0]}</text>
              <text x="59.2" y="68.4" fill="#f8dfe2" opacity="0.5" filter="url(#waxSoft)">${EVENT.coupleA[0]}<tspan font-size="18" dx="1">&amp;</tspan>${EVENT.coupleB[0]}</text>
              <text x="60" y="69" fill="#e2aab2">${EVENT.coupleA[0]}<tspan font-size="18" dx="1">&amp;</tspan>${EVENT.coupleB[0]}</text>
            </g>
          </svg>
        </div>
        <div class="intro-tap-hint">Tap to open</div>
      </div>
      <div class="site-header">
        <div class="eyebrow">You're Invited</div>
        <h1 class="names">${EVENT.coupleA}<span class="ampersand">&amp;</span>${EVENT.coupleB}</h1>
        <div class="subline">${EVENT.dateLabel}</div>
      </div>
      <div class="content-wrap">
        <div class="hero-grid">
          <div class="hero-left">
            <div class="nav-tabs">
              <a href="./" class="current">RSVP</a>
              <a href="travel/">Travel</a>
              <a href="wedding-party/">Wedding Party</a>
              <a href="gallery/">Gallery</a>
              <a href="faq/">FAQ</a>
            </div>
            <div class="photo-slot">Photo coming soon</div>
          </div>
          <div class="hero-right" id="app-card"></div>
        </div>
      </div>
      <footer class="site-footer">
        Questions? Reach out to Maro &amp; George directly. &middot;
        <a href="../privacy/">Privacy Policy</a> &middot;
        <a id="organizerLink">Event organizers</a>
      </footer>
    `;
    document.getElementById('organizerLink').addEventListener('click', () => {
      window.location.href = 'admin/';
    });
  }

  function render(innerHTML){
    document.getElementById('app-card').innerHTML = `<div class="card">${innerHTML}</div>`;
  }

  function registryHTML(){
    if (!REGISTRY_LINKS.length) return '';
    const links = REGISTRY_LINKS.map(r => `<a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.label)}</a>`).join('');
    return `<div class="registry-box"><h3>Registry</h3>${links}</div>`;
  }

  // ---- BUILD-PHASE GATE -----------------------------------------------------
  function renderGate(){
    app.innerHTML = `
      <div class="card gate-wrap">
        <h1 class="names" style="font-size:26px;color:var(--indigo);">Preview</h1>
        <p style="color:#55524a; font-size:13.5px;">This page isn't public yet. Enter the preview passcode to continue.</p>
        <input type="password" id="pw" placeholder="Passcode" />
        <button class="btn" id="unlock-btn">Continue</button>
      </div>`;
    document.getElementById('unlock-btn').onclick = () => {
      if (document.getElementById('pw').value === PREVIEW_PASSCODE) {
        sessionStorage.setItem('wedding_preview_ok', '1');
        boot();
      } else {
        alert('Incorrect passcode.');
      }
    };
  }

  // ---- RSVP FLOW --------------------------------------------------------
  function memberFormHTML(m){
    return `
      <div class="member-block" data-guest-id="${esc(m.id)}">
        <div class="member-name">${esc(m.name)}</div>
        <div class="choice-group">
          <div class="q">Ceremony</div>
          <div class="choice-row" data-field="ceremony">
            <button type="button" class="choice-btn ${m.ceremony === true ? 'selected-yes' : ''}" data-val="yes">Yes</button>
            <button type="button" class="choice-btn ${m.ceremony === false ? 'selected-no' : ''}" data-val="no">No</button>
          </div>
        </div>
        <div class="choice-group">
          <div class="q">Reception</div>
          <div class="choice-row" data-field="reception">
            <button type="button" class="choice-btn ${m.reception === true ? 'selected-yes' : ''}" data-val="yes">Yes</button>
            <button type="button" class="choice-btn ${m.reception === false ? 'selected-no' : ''}" data-val="no">No</button>
          </div>
        </div>
      </div>`;
  }

  function renderFamilyForm(family){
    const deadline = family.deadline
      ? `<div class="deadline-banner">Please respond by ${esc(family.deadline)}</div>`
      : '';
    render(`
      <a href="#" id="back-to-search-link" class="back-link">&larr; Not your family? Back to search</a>
      <h2 style="font-family:'Cormorant Garamond',serif; color:var(--indigo); text-align:center; font-size:22px; margin-bottom:14px;">
        The ${esc(family.familyName)}
      </h2>
      ${deadline}
      <form id="rsvp-form">
        ${family.members.map(memberFormHTML).join('')}
        <div class="field">
          <label>Allergies / Notes (optional)</label>
          <textarea id="family-notes">${esc(family.notes || '')}</textarea>
        </div>
        <button type="submit" class="btn">Submit RSVP</button>
      </form>
      ${registryHTML()}
    `);

    // The browser's own Back button can't be relied on here — since Travel/
    // Wedding Party/Gallery/FAQ are now real separate pages (not anchors on
    // this same page), the tab's history might have "Travel" right before
    // this RSVP form instead of the search screen, so Back would leave the
    // RSVP flow entirely instead of returning to search. This link sidesteps
    // that by just re-rendering the search screen directly, and also clears
    // the "?id=..." from the address bar so reloading the page (or coming
    // back to this tab later) doesn't drop you right back into this family.
    document.getElementById('back-to-search-link').addEventListener('click', (e) => {
      e.preventDefault();
      history.replaceState(null, '', window.location.pathname);
      renderSearch();
    });

    document.querySelectorAll('.choice-row').forEach(row => {
      row.querySelectorAll('.choice-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          row.querySelectorAll('.choice-btn').forEach(b => b.classList.remove('selected-yes','selected-no'));
          btn.classList.add(btn.dataset.val === 'yes' ? 'selected-yes' : 'selected-no');
          row.dataset.selected = btn.dataset.val;
        });
      });
      if (row.dataset.selected === undefined) {
        const pre = row.querySelector('.selected-yes, .selected-no');
        if (pre) row.dataset.selected = pre.classList.contains('selected-yes') ? 'yes' : 'no';
      }
    });

    document.getElementById('rsvp-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const blocks = document.querySelectorAll('.member-block');
      const members = Array.from(blocks).map(block => {
        const ceremonyRow = block.querySelector('[data-field="ceremony"]');
        const receptionRow = block.querySelector('[data-field="reception"]');
        return {
          id: block.dataset.guestId,
          ceremony: ceremonyRow.dataset.selected === 'yes' ? true : (ceremonyRow.dataset.selected === 'no' ? false : null),
          reception: receptionRow.dataset.selected === 'yes' ? true : (receptionRow.dataset.selected === 'no' ? false : null),
        };
      });
      const notes = document.getElementById('family-notes').value;
      const btn = e.target.querySelector('button[type="submit"]');
      btn.disabled = true; btn.textContent = 'Saving...';
      try{
        await apiPost('submitFamilyRsvp', { familyId: family.familyId, members, notes });
        renderConfirmation(family);
      }catch(err){
        alert('Something went wrong submitting your RSVP. Please try again.');
        btn.disabled = false; btn.textContent = 'Submit RSVP';
      }
    });
  }

  function renderConfirmation(family){
    render(`
      <div class="confirmation">
        <div class="check">&#10003;</div>
        <h2>Thank you!</h2>
        <p>Your RSVP for the ${esc(family.familyName)} has been recorded.</p>
        <button class="btn secondary" id="edit-again">Edit my response</button>
        ${registryHTML()}
      </div>
    `);
    document.getElementById('edit-again').onclick = () => loadFamily(family.familyId);
  }

  function renderSearch(notFoundName){
    render(`
      <div class="field">
        <label>Find your family</label>
        <input type="text" id="search-input" placeholder="Type your name" autofocus />
      </div>
      <button class="btn" id="search-btn">Search</button>
      ${notFoundName ? `<div class="not-found">We couldn't find "${esc(notFoundName)}" on the list — please double check the spelling, or reach out to Maro &amp; George directly.</div>` : ''}
      <div id="search-matches"></div>
    `);
    const go = async () => {
      const q = document.getElementById('search-input').value.trim();
      if (!q) return;
      document.getElementById('search-btn').textContent = 'Searching...';
      const result = await apiGet('searchFamily', { query: q });
      document.getElementById('search-btn').textContent = 'Search';
      const matches = (result && result.matches) || [];
      if (matches.length) {
        renderSearchMatches(matches);
      } else {
        renderSearch(q);
      }
    };
    document.getElementById('search-btn').onclick = go;
    document.getElementById('search-input').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  }

  // Shown right under the search box once there's at least one match —
  // nothing here reveals RSVP answers yet, just names, so picking the
  // wrong family by mistake can't expose or let someone edit it. The
  // actual RSVP only loads after they confirm "yes, that's us".
  function renderSearchMatches(matches){
    const box = document.getElementById('search-matches');
    if (!box) return;
    box.innerHTML = `
      <div class="match-list">
        <div class="match-list-label">${matches.length > 1 ? 'A few families matched — which one is yours?' : 'Is this you?'}</div>
        <div class="match-grid">
          ${matches.map(m => `
            <div class="match-card" data-id="${esc(m.familyId)}">
              <div class="match-name">The ${esc(m.familyName)}</div>
              <div class="match-members">
                ${m.memberNames.map(n => `<div class="match-member-name">${esc(n)}</div>`).join('')}
              </div>
              <button type="button" class="match-confirm-btn" data-id="${esc(m.familyId)}">Yes, that's us</button>
            </div>
          `).join('')}
        </div>
        <div class="match-none">Don't see your family? <a href="#" id="search-again-link" class="back-link" style="margin-bottom:0;">Search again</a></div>
      </div>
    `;
    box.querySelectorAll('.match-confirm-btn').forEach(btn => {
      btn.addEventListener('click', () => loadFamily(btn.dataset.id));
    });
    document.getElementById('search-again-link').addEventListener('click', (e) => { e.preventDefault(); renderSearch(); });
  }

  async function loadFamily(id){
    // Apps Script's own response time is the slow part here, not anything in
    // this page, so the one thing we can actually do about "it takes a
    // while, and shows a blank/loading screen every time" is avoid making
    // the person wait on it twice for the same family — e.g. clicking Travel
    // and then coming back, or using the browser's Back button. If we've
    // shown this exact family before this session, paint it instantly from
    // that cached copy, then quietly re-fetch a fresh copy underneath and
    // swap it in if anything changed. First time loading a family, there's
    // nothing to show yet, so it still falls back to the loading message.
    const cacheKey = 'wedding_family_cache_' + id;
    let cached = null;
    try { cached = JSON.parse(sessionStorage.getItem(cacheKey) || 'null'); } catch(e){}
    if (cached && cached.found) {
      renderFamilyForm(cached);
    } else {
      render(`<div class="loading">Loading your invitation...</div>`);
    }
    try{
      const result = await apiGet('getFamilyById', { id });
      if (result && result.found) {
        try { sessionStorage.setItem(cacheKey, JSON.stringify(result)); } catch(e){}
        history.replaceState(null, '', '?id=' + encodeURIComponent(result.familyId));
        renderFamilyForm(result);
      } else if (!cached) {
        renderSearch();
      }
    }catch(e){
      if (!cached) render(`<div class="error-box">Something went wrong loading your invitation. Please try again shortly.</div>`);
    }
  }

  // ---- BOOT -----------------------------------------------------------
  // Safari tints its own address bar / home-indicator area to match
  // whatever color is showing at the top and bottom of the page. While the
  // envelope is up that needs to be its tan tone, not the site's navy --
  // otherwise the status bar reads as a jarring navy stripe over tan.
  function setThemeColor(hex){
    const meta = document.getElementById('theme-color-meta');
    if (meta) meta.setAttribute('content', hex);
  }

  function playIntro(){
    const overlay = document.getElementById('intro-overlay');
    if (!overlay) return;
    // Once per browser session -- a guest navigating back to this page
    // later (e.g. from Travel) shouldn't see the envelope open every time.
    // Visiting with ?replayIntro=1 on the end of the link bypasses this, so
    // it can be replayed for testing without clearing the whole browser tab.
    if (sessionStorage.getItem('wedding_intro_seen') === '1' && !params.has('replayIntro')) {
      overlay.remove();
      setThemeColor('#1B2340');
      return;
    }
    sessionStorage.setItem('wedding_intro_seen', '1');
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      overlay.remove();
      setThemeColor('#1B2340');
      return;
    }
    let opened = false;
    function openEnvelope(){
      if (opened) return;
      opened = true;
      overlay.classList.add('is-opening');
      // The open sequence itself runs ~0.85s in style.css (seal lifts out,
      // flap peels back on its hinge, letter rises, pocket slides away);
      // the overlay then fades on top of that.
      setTimeout(() => {
        overlay.classList.add('is-hidden');
        setThemeColor('#1B2340');
        setTimeout(() => overlay.remove(), 400);
      }, 800);
    }
    overlay.addEventListener('click', openEnvelope);
    setTimeout(openEnvelope, 2200); // opens on its own if nobody taps
  }

  function boot(){
    buildShell();
    playIntro();
    const id = params.get('id');
    if (id) {
      loadFamily(id);
    } else {
      renderSearch();
    }
  }

  if (UNDER_CONSTRUCTION && sessionStorage.getItem('wedding_preview_ok') !== '1') {
    renderGate();
  } else {
    boot();
  }
})();
</script>
</body>
</html>
