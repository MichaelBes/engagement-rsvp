<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maro & George — Save the Date</title>

<link rel="icon" type="image/png" href="engagement/favicon.png">
<link rel="apple-touch-icon" href="engagement/favicon.png">

<meta property="og:title" content="Maro & George are getting married!">
<meta property="og:description" content="Save the date — June 19, 2027. More details coming soon.">
<meta property="og:image" content="https://maroandgeorge.com/engagement/preview.jpg">
<meta property="og:url" content="https://maroandgeorge.com/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap');

  :root{
    --indigo: #1B2340;
    --indigo-2: #262F52;
    --gold: #C9A24B;
    --gold-soft: #E4CD97;
    --ivory: #F8F4EA;
    --wine: #6B1F2B;
    --charcoal: #2A2A28;
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; min-height:100vh;
    background: var(--indigo); color: var(--ivory);
    font-family:'Inter', sans-serif;
    display:flex; align-items:center; justify-content:center;
  }
  body::before{
    content:""; position:fixed; inset:0;
    background: radial-gradient(ellipse at 50% -10%, rgba(201,162,75,0.18), transparent 60%);
    pointer-events:none;
  }
  .wrap{
    max-width: 480px; width:100%;
    padding: 56px 32px;
    text-align:center;
    animation: rise 700ms ease-out both;
  }
  @keyframes rise{ from{opacity:0; transform:translateY(18px);} to{opacity:1; transform:translateY(0);} }

  .eyebrow{
    text-transform:uppercase; letter-spacing:0.22em; font-size:11px;
    color: var(--gold-soft); font-weight:600; margin-bottom: 10px;
  }
  h1{
    font-family:'Cormorant Garamond', serif; font-weight:600;
    font-size: 44px; margin: 0 0 6px; line-height:1.08;
  }
  .ampersand{ color:var(--gold); font-style:italic; font-weight:500; padding:0 8px; }
  .subline{
    font-family:'Cormorant Garamond', serif; font-style:italic;
    font-size:19px; color: var(--gold-soft); margin: 0 0 36px;
  }
  .divider{ display:flex; align-items:center; gap:10px; margin: 26px 0; }
  .divider .line{ flex:1; height:1px; background: linear-gradient(90deg, transparent, rgba(228,205,151,0.5), transparent); }
  .divider .mark{ color:var(--gold); font-size:14px; }

  .countdown{
    display:flex; justify-content:center; gap: 14px; margin: 8px 0 30px;
  }
  .countdown .unit{
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(201,162,75,0.35);
    border-radius: 12px;
    padding: 14px 6px;
    width: 72px;
  }
  .countdown .num{
    font-family:'Cormorant Garamond', serif; font-size: 30px; font-weight:600; color: var(--ivory);
    font-variant-numeric: tabular-nums;
  }
  .countdown .lbl{
    font-size: 9.5px; text-transform:uppercase; letter-spacing:0.12em; color:#b9b4a4; margin-top:4px;
  }

  .note{ font-size:14px; line-height:1.6; color:#cfc9b8; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">Save the Date</div>
    <h1>Maro<span class="ampersand">&amp;</span>George</h1>
    <div class="subline">are getting married</div>

    <div class="divider"><div class="line"></div><div class="mark">&#10022;</div><div class="line"></div></div>

    <div class="countdown" id="countdown">
      <div class="unit"><div class="num" id="cd-days">--</div><div class="lbl">Days</div></div>
      <div class="unit"><div class="num" id="cd-hours">--</div><div class="lbl">Hours</div></div>
      <div class="unit"><div class="num" id="cd-mins">--</div><div class="lbl">Min</div></div>
      <div class="unit"><div class="num" id="cd-secs">--</div><div class="lbl">Sec</div></div>
    </div>

    <div class="note">June 19, 2027<br>More details coming soon.</div>
  </div>

<script>
(function(){
  // When the real wedding site is ready, change REDIRECT_TARGET to "wedding/"
  // and uncomment the redirect line below — or simply re-upload the contents
  // of /wedding/ to this root index.html, whichever is easier at the time.
  var REDIRECT_TARGET = null; // e.g. "wedding/"
  if (REDIRECT_TARGET) {
    window.location.replace(REDIRECT_TARGET);
  }

  // Countdown to June 19, 2027, 12:00 AM America/New_York (Eastern).
  // Eastern is UTC-4 in June (daylight time), so this is 2027-06-19T04:00:00Z.
  var TARGET = new Date("2027-06-19T04:00:00Z").getTime();

  function tick(){
    var now = Date.now();
    var diff = Math.max(0, TARGET - now);
    var days = Math.floor(diff / 86400000);
    var hours = Math.floor((diff % 86400000) / 3600000);
    var mins = Math.floor((diff % 3600000) / 60000);
    var secs = Math.floor((diff % 60000) / 1000);
    document.getElementById('cd-days').textContent = days;
    document.getElementById('cd-hours').textContent = String(hours).padStart(2,'0');
    document.getElementById('cd-mins').textContent = String(mins).padStart(2,'0');
    document.getElementById('cd-secs').textContent = String(secs).padStart(2,'0');
  }
  tick();
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
